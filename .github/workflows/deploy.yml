name: Deploy

on:
  push:
    branches: [main]

jobs:
  test-backend:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test

  test-frontend:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          API_URL: http://localhost:3000
        run: npm run build

  deploy:
    needs: [test-backend, test-frontend]
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup old containers
        run: docker compose down --remove-orphans || true

      - name: Build & Deploy
        run: |
          docker compose build --no-cache
          docker compose up -d --remove-orphans

      - name: Clean up old images
        run: docker image prune -f

      - name: Health check
        run: |
          # Scrutation plutôt qu'une attente fixe : un premier démarrage
          # (volume vierge + migrations Prisma) est bien plus lent qu'un
          # redéploiement courant.
          for i in $(seq 1 30); do
            if curl -fs http://localhost:3000/health >/dev/null \
               && curl -fs http://localhost:3001/ >/dev/null; then
              echo "Services disponibles après $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "Services indisponibles après 150s"
          exit 1

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker logs backend || true
          docker logs frontend || true
