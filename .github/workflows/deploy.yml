name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check free disk space
        run: |
          free_gb=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "Espace libre: ${free_gb} Go"
          if [ "$free_gb" -lt 6 ]; then
            echo "::error::Moins de 6Go disponibles, déploiement annulé avant d'arrêter la prod"
            exit 1
          fi

      - name: Cleanup old containers
        run: docker compose down --remove-orphans || true

      - name: Build & Deploy
        run: |
          docker compose build
          docker compose up -d --remove-orphans

      - name: Clean up docker
        if: always()
        run: |
          docker image prune -f
          docker builder prune -f --filter "until=168h"

      - name: Health check
        run: |
          # Scrutation plutôt qu'une attente fixe : un premier démarrage
          # (volume vierge + migrations Prisma) est bien plus lent qu'un
          # redéploiement courant.
          for i in $(seq 1 30); do
            if curl -fs http://localhost:3000/health >/dev/null \
               && curl -fs http://localhost:3001/ >/dev/null; then
              echo "Services disponibles après $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "Services indisponibles après 150s"
          exit 1

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker logs backend || true
          docker logs frontend || true
